[package]
name = "trollnet-desktop"
version = "0.1.0"
description = "TrollNet — desktop shell for the merged self-contained host"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
