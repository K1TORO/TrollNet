<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrollNet</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; height: 100vh; display: grid; place-items: center;
           background: #0f1117; color: #e8eaf0; font-family: system-ui, -apple-system, sans-serif; }
    .box { text-align: center; }
    h1 { margin: 0 0 .5rem; letter-spacing: .5px; }
    p { color: #9aa3b2; margin: .25rem 0; }
    .ring { width: 38px; height: 38px; margin: 1.25rem auto 0; border-radius: 50%;
            border: 3px solid #2a2f3a; border-top-color: #6ea8fe; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <h1>TrollNet</h1>
    <p id="status">Starting the local server…</p>
    <div class="ring"></div>
  </div>
  <script>
    // The Tauri shell spawns the .NET host; this page waits for it, then loads the real UI the host serves.
    const HOST = 'http://127.0.0.1:8080';
    const status = document.getElementById('status');
    (async () => {
      for (let i = 0; i < 120; i++) {           // ~60s
        try {
          const r = await fetch(HOST + '/health', { cache: 'no-store' });
          // Cache-bust the redirect so a freshly rebuilt frontend always loads (WebKitGTK caches aggressively).
          if (r.ok) { location.replace(HOST + '/?v=' + Date.now()); return; }
        } catch (_) { /* host not up yet */ }
        if (i === 8) status.textContent = 'Still starting (first run creates the database)…';
        await new Promise(r => setTimeout(r, 500));
      }
      status.textContent = 'Could not reach the local server. See the logs.';
    })();
  </script>
</body>
</html>
