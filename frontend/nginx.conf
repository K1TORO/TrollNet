server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;

    # VULN-SPOT #02: Cross-Site Scripting (CWE-79), second layer.
    #   The Content-Security-Policy only allows scripts from this origin, so injected inline scripts would not run.
    # VULN-SPOT #20: Clickjacking (CWE-1021)
    #   X-Frame-Options / frame-ancestors stop other sites from embedding TrollNet in an invisible frame.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API calls go to the gateway on the internal Docker network.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # VULN-SPOT #17: Spoofable client IP (CWE-348). Overwrite (not append) so clients cannot fake their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
