server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;

    # VULN-SPOT #02: Cross-Site Scripting (CWE-79), second layer — INTENTIONALLY WEAK
    #   The CSP allows 'unsafe-inline' scripts and arbitrary origins, so inline event handlers injected by
    #   stored XSS (e.g. <img src=x onerror=...>) execute and can exfiltrate data anywhere.
    #   Fix: a strict CSP with script-src 'self' and no unsafe-inline/unsafe-eval.
    # VULN-SPOT #20: Clickjacking (CWE-1021) — INTENTIONAL FOR TRAINING
    #   X-Frame-Options was removed and frame-ancestors allows any site to embed TrollNet in an invisible frame.
    #   Fix: add_header X-Frame-Options "DENY" and frame-ancestors 'none'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "unsafe-url" always;
    add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; frame-ancestors *" always;

    # API calls go to the gateway on the internal Docker network.
    # VULN-SPOT #08 (CWE-306): /internal/ is proxied too, so the unauthenticated system endpoints are reachable.
    location ~ ^/(api|internal)/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # VULN-SPOT #17: Spoofable client IP (CWE-348) — INTENTIONAL FOR TRAINING
        #   $proxy_add_x_forwarded_for appends to any client-supplied X-Forwarded-For instead of replacing it,
        #   so the attacker-controlled leftmost value becomes the "client IP" used by rate limiters.
        #   Fix: proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
